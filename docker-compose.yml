# =============================================================================
# New Radar - Hermes Agent API Server
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Hermes Agent API Server (OpenAI-compatible)
  # ---------------------------------------------------------------------------
  radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
      - HERMES_HOME=/app/.hermes
      - PYTHONPATH=/app/hermes-agent:/app
      - HF_ENDPOINT=https://hf-mirror.com
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${API_SERVER_KEY:-hermes-secret-key-2026}
      - API_SERVER_PORT=8642
      - API_SERVER_HOST=0.0.0.0
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-radar}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-radar}
      - DB_NAME=${POSTGRES_DB:-radar}
    env_file:
      - .env
    ports:
      - "8642:8642"
    volumes:
      - ./logs:/app/logs
      - ./final_reports:/app/final_reports
      - ./.env:/app/.env
      - ./hermes-agent/mcp:/app/mcp
      - ./hermes-agent/skills:/app/skills
      - ./hermes-agent/microservices:/app/microservices
      - ./hermes-agent/MindSpider:/app/MindSpider
      - ./hermes-agent/data:/app/.hermes
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector Database
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg15
    container_name: radar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - radar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Adminer Database Management UI
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: radar-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Hermes Web UI (Dashboard)
  # ---------------------------------------------------------------------------
  web-ui:
    build:
      context: ./hermes-agent/web
      dockerfile: Dockerfile
    container_name: radar-web-ui
    restart: unless-stopped
    environment:
      - PORT=8648
      - UPSTREAM=http://radar:8642
      - HERMES_HOME=/app/.hermes
      - AUTH_DISABLED=false
    ports:
      - "8648:8648"
    volumes:
      - ./hermes-agent/data:/app/.hermes
    depends_on:
      radar:
        condition: service_healthy

volumes:
  radar_db_data: